[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pi4-ndr-sensor"
version = "1.1.0"
description = "Lightweight NDR sensor for Raspberry Pi 4 — Suricata + Zeek log forwarder"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Vasilis Tsiamouras", email = "btsiamouras@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
]

[project.scripts]
pi4-ndr = "ndr_sensor.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
