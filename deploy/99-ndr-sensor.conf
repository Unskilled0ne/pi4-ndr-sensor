# Raspberry Pi 4 NDR Sensor - Kernel & Network Buffer Tuning
# Optimize ring buffers and socket memory for high-throughput passive packet capture

# Maximum receive socket buffer size (16MB)
net.core.rmem_max = 16777216
net.core.rmem_default = 16777216

# Maximum number of packets queued on the input side when the interface receives packets faster than kernel can process
net.core.netdev_max_backlog = 10000

# Prevent aggressive swapping under traffic bursts to keep Suricata and Zeek in RAM
vm.swappiness = 10

# Memory dirty ratios to smooth out disk write spikes on SD / USB storage
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5
