sensor:
  id: "pi4-ndr-01"
  description: "Raspberry Pi 4 Passive NDR Sensor"
  network_zone: "perimeter-tap"
  interface: "eth0"

logs:
  suricata:
    enabled: true
    path: "/var/log/suricata/eve.json"
    types: ["alert", "flow", "dns", "http", "tls", "stats"]
  zeek:
    enabled: true
    dir: "/var/log/zeek/current"
    files:
      - "conn.log"
      - "dns.log"
      - "http.log"
      - "ssl.log"
      - "notice.log"

state:
  offset_file: "/var/lib/pi4-ndr/offset_state.json"

forwarding:
  endpoint_url: "http://10.42.0.1:8000/api/v1/alerts/investigate"
  mode: "aegis_soar"
  batch_size: 50
  max_queue_size: 5000
  flush_interval_seconds: 2.0
  timeout_seconds: 5.0
  max_retries: 3
  backoff_factor: 1.5
  tls_verify: true
  tls_ca_bundle: null
  auth:
    type: "bearer"
    token: ""
    header_name: "Authorization"

filters:
  always_forward_alerts: true
  suricata_forward_flow: false
  suricata_forward_dns: true
  suricata_forward_http: true
  suricata_forward_tls: true
  zeek_forward_conn: false
  zeek_forward_dns: true
  zeek_forward_http: true
  zeek_forward_ssl: true
  zeek_forward_notice: true
  dedup_window_seconds: 60.0
